      <path d="M80 0H0V80" fill="none" stroke="#ddd4c6" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#2a2926" flood-opacity=".12"/>
