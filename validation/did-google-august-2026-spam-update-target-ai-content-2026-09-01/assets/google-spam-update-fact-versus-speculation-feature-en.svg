  <text x="90" y="158" font-family="Arial, sans-serif" font-size="52" font-weight="800" fill="#25272a">Separate official facts from speculation</text>

  <rect x="70" y="196" width="835" height="510" rx="28" fill="#fffdf8" stroke="#d7cbb8" stroke-width="2" filter="url(#shadow)"/>
