  <line x1="130" y1="448" x2="792" y2="448" stroke="#b8cdca" stroke-width="10" stroke-linecap="round"/>
  <circle cx="130" cy="448" r="15" fill="#2d7f79"/>
  <circle cx="792" cy="448" r="15" fill="#2d7f79"/>
  <text x="115" y="515" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#2b706b">GLOBAL • ALL LANGUAGES</text>
  <text x="115" y="580" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#20292a">COMPLETED AUGUST 21</text>
  <text x="115" y="628" font-family="Arial, sans-serif" font-size="29" fill="#625d56">No target category was announced.</text>

  <g fill="#eadbd2" stroke="#c99578" stroke-width="2">
    <rect x="1050" y="246" width="460" height="92" rx="20"/>
    <rect x="1070" y="366" width="440" height="92" rx="20"/>
    <rect x="1088" y="486" width="422" height="92" rx="20"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#704f45">
    <text x="1090" y="302">“AI CONTENT”</text><text x="1468" y="302">?</text>
    <text x="1110" y="422">“ALL SCALED PAGES”</text><text x="1468" y="422">?</text>
    <text x="1128" y="542">“AUTOMATIC PENALTY”</text><text x="1468" y="542">?</text>
  </g>

  <g transform="translate(918 510)">
    <circle cx="0" cy="0" r="136" fill="#f3eee4" stroke="#25272a" stroke-width="20"/>
    <circle cx="0" cy="0" r="90" fill="#fffdf8" stroke="#88aaa6" stroke-width="6"/>
    <line x1="94" y1="98" x2="275" y2="280" stroke="#25272a" stroke-width="27"/>
