    <g font-size="27" font-weight="800" fill="#282b2d"><text x="102" y="404">MARK TIME</text><text x="402" y="404">SEGMENT GSC</text><text x="702" y="404">TECHNICAL</text><text x="1002" y="404">FIND A PATTERN</text><text x="1302" y="404">CHANGE ONE THING</text></g>
