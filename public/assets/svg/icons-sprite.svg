<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- ============================================================
       ICON SPRITE — Gamification Layer
       Semua symbol: viewBox 0 0 24 24, stroke="currentColor",
       fill="none", stroke-width 1.6, monoline pixel-friendly.
       Pakai lewat: <svg class="icon"><use href="icons-sprite.svg#icon-star"/></svg>
       Warna diatur via CSS `color: var(--gold)` dsb (currentColor).
       ============================================================ -->

  <!-- 1. HUD — Level / Star (item report 1.1) -->
  <symbol id="icon-star-level" viewBox="0 0 24 24">
    <path d="M12 3 L14.3 9.2 L21 9.8 L15.8 14 L17.4 20.6 L12 16.9 L6.6 20.6 L8.2 14 L3 9.8 L9.7 9.2 Z"
          stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" fill="none"/>
  </symbol>

  <!-- 2. HUD — Streak / Flame (item report 1.1) -->
  <symbol id="icon-flame-streak" viewBox="0 0 24 24">
    <path d="M12 2.5 C12 6 8.5 7 8.5 11 C8.5 13.5 10 14.5 10 14.5 C9 13 9.5 11.5 10.5 10.5
             C10.5 13 12.5 13.5 12.5 16 C12.5 17.8 11.2 18.6 11.2 18.6 C14 18.6 17 16.6 17 13
             C17 9.5 14 8.5 14 5.5 C14 4 13 3 12 2.5 Z"
          stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
    <circle cx="12" cy="19" r="1.6" stroke="currentColor" stroke-width="1.4" fill="none"/>
  </symbol>

  <!-- 3. HUD — Location pin (Home badge row) -->
  <symbol id="icon-pin" viewBox="0 0 24 24">
    <path d="M12 21 C12 21 18 14.6 18 10 C18 6.7 15.3 4 12 4 C8.7 4 6 6.7 6 10 C6 14.6 12 21 12 21 Z"
          stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" fill="none"/>
    <rect x="10.5" y="8.5" width="3" height="3" stroke="currentColor" stroke-width="1.3" fill="none"/>
  </symbol>

  <!-- 4. Locked Slot icon (item report 4.3) -->
  <symbol id="icon-lock" viewBox="0 0 24 24">
    <rect x="5.5" y="11" width="13" height="9" stroke="currentColor" stroke-width="1.6" fill="none"/>
    <path d="M8.5 11 V8 C8.5 5.5 10 4 12 4 C14 4 15.5 5.5 15.5 8 V11"
          stroke="currentColor" stroke-width="1.6" fill="none"/>
    <rect x="11.2" y="14" width="1.6" height="3.4" fill="currentColor"/>
  </symbol>

  <!-- 5. "Kamu di sini" marker — square pixel node (item report 2.3) -->
  <symbol id="icon-marker-current" viewBox="0 0 24 24">
    <rect x="9" y="9" width="6" height="6" stroke="currentColor" stroke-width="1.6" fill="currentColor"/>
    <rect x="4" y="4" width="16" height="16" stroke="currentColor" stroke-width="1.2" fill="none" opacity="0.5"/>
  </symbol>

  <!-- 6. Trophy — dipakai di Toast unlock (item report 6.1) -->
  <symbol id="icon-trophy" viewBox="0 0 24 24">
    <path d="M7 4 H17 V9 C17 12 14.8 14 12 14 C9.2 14 7 12 7 9 Z"
          stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" fill="none"/>
    <path d="M7 5.5 H4.5 C4.5 8 5.5 9.5 7.5 10" stroke="currentColor" stroke-width="1.5" fill="none"/>
    <path d="M17 5.5 H19.5 C19.5 8 18.5 9.5 16.5 10" stroke="currentColor" stroke-width="1.5" fill="none"/>
    <line x1="12" y1="14" x2="12" y2="18" stroke="currentColor" stroke-width="1.6"/>
    <line x1="8.5" y1="20" x2="15.5" y2="20" stroke="currentColor" stroke-width="1.6"/>
    <line x1="10" y1="18" x2="14" y2="18" stroke="currentColor" stroke-width="1.6"/>
  </symbol>

  <!-- 7. Clipboard — dipakai di Toast "copied" (item report 6.1) -->
  <symbol id="icon-clipboard" viewBox="0 0 24 24">
    <rect x="6" y="5" width="12" height="16" stroke="currentColor" stroke-width="1.6" fill="none"/>
    <rect x="9" y="3" width="6" height="3" stroke="currentColor" stroke-width="1.6" fill="none"/>
    <line x1="8.5" y1="11" x2="15.5" y2="11" stroke="currentColor" stroke-width="1.4"/>
    <line x1="8.5" y1="14.5" x2="15.5" y2="14.5" stroke="currentColor" stroke-width="1.4"/>
  </symbol>

  <!-- 8. Chevron double-up — untuk XP bar % indicator (item report 1.2) -->
  <symbol id="icon-chevron-up" viewBox="0 0 24 24">
    <path d="M6 15 L12 9 L18 15" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="square"/>
  </symbol>

  <!-- 9. Portal / ring — dipakai untuk hover ripple asal titik klik (item report 5.2), versi statis referensi -->
  <symbol id="icon-portal-ring" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6" fill="none"/>
    <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.2" fill="none" opacity="0.6"/>
  </symbol>

  <!-- 10. Compass (referensi ikon yang sudah ada di navbar, disediakan versi vektor bersih) -->
  <symbol id="icon-compass" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6" fill="none"/>
    <path d="M15.5 8.5 L13 13 L8.5 15.5 L11 11 Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" fill="currentColor"/>
  </symbol>

  <!-- 11. Command key (⌘) — referensi ikon command palette navbar (item report 6.3) -->
  <symbol id="icon-command" viewBox="0 0 24 24">
    <path d="M8.5 5.5 A2.5 2.5 0 1 0 11 8 V16 A2.5 2.5 0 1 0 13.5 18.5 V5.5 A2.5 2.5 0 1 0 16 8 H8 A2.5 2.5 0 1 0 8.5 5.5"
          stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
  </symbol>

</svg>
